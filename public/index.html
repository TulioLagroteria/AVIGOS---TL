<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Avigos Interativa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="image.src" type="image/jpg" href="images/logoAVIGOS.jpg" />
    <link rel="favicon" type="image/png" href="images/favicon-galo.png" />
</head>
<body>
    <img src="images/logoAVIGOS.jpg" alt="Logo AVIGOS" class="logo-avigos" id="logoAVIGOSImage">
    <!-- Container posicionado de forma fixa ou relativa na sua página -->
    <div class="logo-avigos-container" id="logoAVIGOS">
        <!-- O círculo de fundo dourado/roxo permanece estático -->
        <div class="logo-bg-circle"></div>
        
        <!-- O Galo com os estados de movimento -->
        <div class="logo-rooster-box">
            <div class="rooster-static"></div> <!-- Imagem do galo parado -->
            <div class="rooster-animated"></div> <!-- Imagem/GIF do galo batendo asas e cantando -->
        </div>

        <!-- O texto "AVIGOS" que irá pulsar -->
        <div class="logo-text-avigos"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
